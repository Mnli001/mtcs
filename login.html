<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нэвтрэх — MTCS</title>
    
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css?v=103">
    
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #f8fafc;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 28px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .auth-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .auth-brand .brand-icon {
            width: 38px;
            height: 38px;
            font-size: 18px;
            background: #0f172a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .auth-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .auth-header p {
            color: #64748b;
            font-size: 13px;
        }

        .auth-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 18px;
        }

        .auth-tab {
            flex: 1;
            padding: 8px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #475569;
            font-weight: 600;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: none;
            transition: all 0.15s ease;
        }

        .auth-tab.active {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
            box-shadow: none;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .auth-form label {
            font-size: 13px;
            color: #334155;
            font-weight: 600;
            margin-bottom: 4px;
            display: block;
        }

        .auth-form input {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            font-size: 14px;
            color: #0f172a !important;
            background-color: #ffffff !important;
            border: 1px solid #d1d5db !important;
            border-radius: 6px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .auth-form input:focus {
            border-color: #2563eb !important;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1) !important;
        }

        .auth-btn {
            width: 100%;
            padding: 11px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 6px;
            border: none;
            background: #0f172a;
            color: #ffffff;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            transition: background-color 0.15s ease;
        }

        .auth-btn:hover {
            background: #1e293b;
        }

        .auth-alert {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            margin-bottom: 14px;
        }

        .auth-alert.error {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            display: block;
        }

        .auth-alert.success {
            background: #dcfce7;
            border: 1px solid #bbf7d0;
            color: #15803d;
            display: block;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #e2e8f0;
        }

        .link-guest {
            color: #475569;
            font-size: 13px;
            text-decoration: underline;
            font-weight: 600;
        }

        .link-guest:hover {
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            
            <div class="auth-header">
                <div class="auth-brand">
                    <div class="brand-icon">M</div>
                    <div style="text-align: left;">
                        <h1 style="font-size: 18px; font-weight: 800; color: #000000; margin: 0;">MTCS</h1>
                    </div>
                </div>
                <h2 id="authTitle">Нэвтрэх</h2>
            </div>

            <!-- Tab Switcher (Login / Signup) -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="tabLogin" onclick="setAuthMode('login')">Нэвтрэх</button>
                <button type="button" class="auth-tab" id="tabSignup" onclick="setAuthMode('signup')">Бүртгүүлэх</button>
            </div>

            <!-- Feedback Alert Message -->
            <div id="authAlert" class="auth-alert"></div>

            <!-- Form -->
            <form id="authForm" class="auth-form" onsubmit="return handleAuthSubmit(event)">
                <div class="form-group" id="nameGroup" style="display: none;">
                    <label for="nameInput">Нэр:</label>
                    <input type="text" id="nameInput" placeholder="Таны нэр" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="emailInput">Имэйл хаяг:</label>
                    <input type="email" id="emailInput" placeholder="Имэйл" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="passwordInput">Нууц үг:</label>
                    <input type="password" id="passwordInput" placeholder="Нууц үг" required minlength="6" autocomplete="current-password">
                </div>

                <button type="submit" id="authSubmitBtn" class="auth-btn">
                    Нэвтрэх
                </button>
            </form>

            <div class="auth-footer">
                <a href="index.html" class="link-guest" onclick="sessionStorage.setItem('mtcs_guest', 'true'); localStorage.removeItem('mtcs_user');">
                    Зочноор орох
                </a>
            </div>

        </div>
    </div>

    <!-- Supabase Client Init -->
    <script src="js/supabase.js?v=103"></script>

    <script>
        let currentMode = 'login'; // 'login' | 'signup'

        function setAuthMode(mode) {
            currentMode = mode;
            const tabLogin = document.getElementById('tabLogin');
            const tabSignup = document.getElementById('tabSignup');
            const title = document.getElementById('authTitle');
            const btn = document.getElementById('authSubmitBtn');
            const alertBox = document.getElementById('authAlert');
            const nameGroup = document.getElementById('nameGroup');
            const nameInput = document.getElementById('nameInput');

            alertBox.className = 'auth-alert';
            alertBox.style.display = 'none';

            if (mode === 'login') {
                tabLogin.classList.add('active');
                tabSignup.classList.remove('active');
                title.textContent = 'Нэвтрэх';
                btn.textContent = 'Нэвтрэх';
                if (nameGroup) nameGroup.style.display = 'none';
                if (nameInput) nameInput.removeAttribute('required');
            } else {
                tabSignup.classList.add('active');
                tabLogin.classList.remove('active');
                title.textContent = 'Бүртгүүлэх';
                btn.textContent = 'Бүртгүүлэх';
                if (nameGroup) nameGroup.style.display = 'block';
                if (nameInput) nameInput.setAttribute('required', 'true');
            }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('nameInput') ? document.getElementById('nameInput').value.trim() : '';
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const btn = document.getElementById('authSubmitBtn');
            const alertBox = document.getElementById('authAlert');

            if (!email || !password) return;
            if (currentMode === 'signup' && !name) {
                showAlert('Та нэрээ оруулна уу.', 'error');
                return;
            }

            // Check if Supabase client is initialized
            if (!window.supabaseClient) {
                showAlert('Supabase холбогдоогүй байна. Та "Зочноор орох" холбоосоор шууд ашиглаж болно.', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Түр хүлээнэ үү...';
            alertBox.style.display = 'none';

            try {
                if (currentMode === 'login') {
                    const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (error) {
                        showAlert(getReadableError(error.message), 'error');
                        btn.disabled = false;
                        btn.textContent = 'Нэвтрэх';
                        return;
                    }

                    sessionStorage.removeItem('mtcs_guest');
                    const displayName = (data.user && data.user.user_metadata && data.user.user_metadata.display_name) || email.split('@')[0];
                    if (data && data.user) {
                        localStorage.setItem('mtcs_user', JSON.stringify({
                            id: data.user.id,
                            email: data.user.email,
                            user_metadata: { display_name: displayName }
                        }));

                        window.supabaseClient.from('users').upsert({
                            id: data.user.id,
                            email: data.user.email,
                            display_name: displayName,
                            rank: 'Хүрэл'
                        }, { onConflict: 'id' }).then(() => {}).catch(() => {});
                    }
                    showAlert('Амжилттай нэвтэрлээ!', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                } else {
                    const displayName = name || email.split('@')[0];
                    const { data, error } = await window.supabaseClient.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: { display_name: displayName }
                        }
                    });

                    if (error) {
                        if (error.message && (error.message.includes('rate limit') || error.message.includes('over_email_send_rate_limit'))) {
                            showAlert('Supabase имэйл лимит хэтэрсэн байна. Supabase төсөл рүүгээ ороод Authentication -> Sign In / Providers -> Email -> "Confirm email"-ийг унтраана уу.', 'error');
                            btn.disabled = false;
                            btn.textContent = 'Бүртгүүлэх';
                            return;
                        }

                        showAlert(getReadableError(error.message), 'error');
                        btn.disabled = false;
                        btn.textContent = 'Бүртгүүлэх';
                        return;
                    }

                    // Supabase-д тухайн имэйл аль хэдийн бүртгэлтэй үед identities хоосон ирдэг
                    if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
                        showAlert('Энэ имэйл хаяг аль хэдийн бүртгэлтэй байна. Та нэвтэрнэ үү.', 'error');
                        btn.disabled = false;
                        btn.textContent = 'Бүртгүүлэх';
                        return;
                    }

                    sessionStorage.removeItem('mtcs_guest');
                    const userId = data && data.user ? data.user.id : 'user_' + Date.now();
                    localStorage.setItem('mtcs_user', JSON.stringify({
                        id: userId,
                        email: email,
                        user_metadata: { display_name: displayName }
                    }));

                    if (data && data.user) {
                        window.supabaseClient.from('users').upsert({
                            id: data.user.id,
                            email: data.user.email,
                            display_name: displayName,
                            rank: 'Хүрэл'
                        }, { onConflict: 'id' }).then(() => {}).catch(() => {});
                    }

                    showAlert('Амжилттай бүртгэгдлээ!', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                }
            } catch (err) {
                console.error("Auth error:", err);
                showAlert('Холболтын алдаа гарлаа. Та дахин оролдоно уу.', 'error');
                btn.disabled = false;
                btn.textContent = currentMode === 'login' ? 'Нэвтрэх' : 'Бүртгүүлэх';
            }
        }

        function showAlert(text, type) {
            const alertBox = document.getElementById('authAlert');
            alertBox.textContent = text;
            alertBox.className = `auth-alert ${type}`;
            alertBox.style.display = 'block';
        }

        function getReadableError(msg) {
            if (!msg) return 'Алдаа гарлаа.';
            const lower = msg.toLowerCase();

            if (lower.includes('invalid login credentials')) {
                return 'Имэйл эсвэл нууц үг буруу байна.';
            }
            if (lower.includes('email not confirmed')) {
                return 'Имэйл хаягаа баталгаажуулна уу. (Эсвэл Supabase дээр Confirm email-ийг унтраана уу)';
            }
            if (lower.includes('is invalid') || lower.includes('already registered') || lower.includes('already exists') || lower.includes('invalid email') || lower.includes('user already registered')) {
                return 'Бүртгэлтэй байна.';
            }
            if (lower.includes('rate limit') || lower.includes('over_email_send_rate_limit')) {
                return 'Имэйл илгээх лимит хэтэрсэн байна.';
            }
            if (lower.includes('database error finding user') || lower.includes('database error')) {
                return 'Бүртгэл олдсонгүй. Шинээр бүртгүүлнэ үү.';
            }
            if (lower.includes('password should be at least')) {
                return 'Нууц үг хамгийн багадаа 6 тэмдэгт байх ёстой.';
            }
            return msg;
        }

        // Auto-redirect if already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.supabaseClient) {
                const { data: { session } } = await window.supabaseClient.auth.getSession();
                if (session) {
                    window.location.href = 'index.html';
                }
            }
        });
    </script>
</body>
</html>
